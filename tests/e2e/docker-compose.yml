# Hermetic end-to-end run: a throwaway MinIO plus a runner that drives
# model.py against it. Nothing outside this file is required, and nothing
# outlives `docker compose down -v`.
#
#   ./run_e2e.sh                     from the repository root
#   docker compose -f tests/e2e/docker-compose.yml run --rm runner

name: s3duck-e2e

services:
  minio:
    # MinIO archived its open-source server in 2025. quay.io/minio/minio no
    # longer grants anonymous pulls, the Docker Hub repository is gone, and
    # dl.min.io answers 410 for every community binary and hotfix — so the
    # image this file used to name cannot be fetched by anyone any more.
    #
    # This is the Alpine project's rebuild of the FINAL community release,
    # pinned to that exact upstream tag. Staying on MinIO matters more than
    # staying current here: half of this project's documented limitations
    # are statements about how MinIO behaves, and a different server would
    # answer differently and quietly stop checking them. Override it with
    # S3DUCK_TEST_MINIO_IMAGE to point at a MinIO you host yourself.
    image: ${S3DUCK_TEST_MINIO_IMAGE:-alpine/minio:RELEASE.2025-10-15T17-29-55Z}
    command: server /data --address :9000
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Object Lock needs this off; it is a throwaway server on a private
      # compose network either way.
      MINIO_BROWSER: "off"
    # tmpfs rather than a volume, for the reason the old file gave for
    # having no volume at all: a run that depended on what a previous one
    # left behind would not be hermetic. It also settles ownership, which a
    # named volume does not — the server runs as uid 100 and a fresh volume
    # arrives owned by root, which MinIO reports as "file access denied".
    tmpfs:
      - /data:uid=100,gid=101,mode=0750
    healthcheck:
      # This image carries no mc and no curl; wget is what it has.
      test: ["CMD", "wget", "-q", "-O", "-",
             "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

  runner:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3DUCK_TEST_ENDPOINT: http://minio:9000
      S3DUCK_TEST_ACCESS_KEY: minioadmin
      S3DUCK_TEST_SECRET_KEY: minioadmin
      S3DUCK_TEST_REGION: us-east-1
    volumes:
      # Read-only: the suite must not be able to edit the tree it is testing.
      - ../..:/app:ro
