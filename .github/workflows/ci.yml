name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (py${{ matrix.python }}, Qt ${{ matrix.qt }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requirements.txt pins PyQt6, but a .deb install gets the distro's Qt
        # and a wheel install gets the newest. Blank toolbar icons on Linux Mint
        # came from exactly that spread, so more than one Qt is covered here.
        include:
          - {python: "3.11", qt: pinned}
          - {python: "3.12", qt: pinned}
          - {python: "3.12", qt: latest}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the libraries Qt's offscreen plugin links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install Python dependencies (pinned)
        if: matrix.qt == 'pinned'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Python dependencies (latest)
        if: matrix.qt == 'latest'
        run: |
          python -m pip install --upgrade pip
          pip install boto3 cryptography PyQt6

      - name: Report the environment under test
        run: python tools/ci_env.py

      # QT_QPA_PLATFORM is deliberately NOT set here: tests/__init__.py sets it
      # before any Qt import, and letting the suite do it keeps that covered.
      - name: Run the test suite
        run: python -m unittest discover -s tests

  no-svg:
    name: icons without the Qt SVG plugin
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the libraries Qt's offscreen plugin links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 cryptography PyQt6

      # Debian and Mint ship python3-pyqt6 with no QtSvg, so QIcon loads an
      # .svg into a non-null icon that paints nothing. Deleting the plugin
      # reproduces that for real instead of mocking it.
      - name: Strip the SVG plugin, as the distribution package does
        run: python tools/ci_strip_svg.py

      # A fresh process: Qt libraries loaded before the deletion would keep
      # working and the check would pass for the wrong reason.
      - name: Confirm SVG icons really cannot render
        run: python tools/ci_check_no_svg.py

      - name: Every icon must still render
        run: python tools/icon_report.py

      - name: Icon fallback tests
        run: python -m unittest tests.test_units.IconFallbackTests

  package:
    name: .deb package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the package
        run: bash build_deb.sh

      - name: Check the metadata and payload
        run: bash tools/ci_check_deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: s3duck-deb
          path: build/*.deb
          if-no-files-found: error
